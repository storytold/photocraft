name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "book/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mdBook build
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      timeout-minutes: 15
      # The book needs mdBook only: no craft-fonts, apt packages, wasm target or nextest.
      craft-fonts-ref: ""
      targets: ""
      free-disk-space: false
      # Prebuilt mdBook, the version cargo install built before.
      tools: mdbook@0.4.52
      cache-version: v1-docs
      command: mdbook build book
