name: Guide edit interactions

on:
  pull_request:
  push:
    branches: [main, feat/edit-session-guide-dialogs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      PHOTOCRAFT_NO_PRINT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PerchAnton/interaction-check
          ref: f8d4282d61576ffe78d18553c642d215887e2d9f
          path: .interaction-check
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: guide-edit-interactions
      - name: Build the real dialog adapter
        run: cargo build --locked -p photocraft-ui-egui --example guide_edit_scenarios -j 2
      - name: Replay guide editing scenarios
        run: >-
          python3 .interaction-check/interaction_check.py --timeout 30
          tests/interactions/guide-edit/*.json -- target/debug/examples/guide_edit_scenarios
