name: PhotoCraft Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [android-native]
    paths:
      - 'apps/photocraft-android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Compile Rust and assemble debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust stable and Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Resolve installed Android NDK path
        run: |
          NDK_PATH="${ANDROID_HOME}/ndk/27.2.12479018"
          test -x "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          ln -s "$NDK_PATH" "${RUNNER_TEMP}/android-ndk"

      - name: Compile PhotoCraft Rust ARM64 library
        env:
          CC_aarch64_linux_android: ${{ runner.temp }}/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          CXX_aarch64_linux_android: ${{ runner.temp }}/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ runner.temp }}/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          AR_aarch64_linux_android: ${{ runner.temp }}/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo build --release --target aarch64-linux-android -p photocraft-android

      - name: Copy native library into Android project
        run: |
          mkdir -p apps/photocraft-android/android/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libphotocraft_android.so apps/photocraft-android/android/src/main/jniLibs/arm64-v8a/

      - name: Assemble debug APK
        working-directory: apps/photocraft-android/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-Android-arm64-debug
          path: apps/photocraft-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
