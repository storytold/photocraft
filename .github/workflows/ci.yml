  selection-morphology-quick-perf:
    if: inputs.selection_morphology == true || inputs.color_range == true || inputs.selection_combining == true || inputs.brush_tip == true || inputs.dry_mixer == true
    name: quick performance suite
    # Match perf-nightly.yml: Linux llvmpipe lacks the float render targets needed by
    # bevel_bench, so its required GPU rows cannot be measured there.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
      # perf-nightly.yml's entry (same key and runner); only that job saves it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          shared-key: perf-release
          save-if: false
      - name: Quick performance suite
