name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  # A push to main is the run that publishes coverage; superseded runs there would never finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonarcloud:
    # This version checks out this repo's pinned craft-i18n catalog before coverage tests; update
    # the ref when intentionally adopting a newer shared SonarCloud workflow.
    uses: storytold/craft-common-actions/.github/workflows/sonarcloud.yml@20ebee3cb1eef69f886b98d566aa07552ee0196f
    with:
      timeout-minutes: 120
      fonts-ref: cc9269cd8d8258785dac603fba3122e5d2556795
      # The coverage build's ~1.3 GB cache would not fit the repository's 10 GB cache budget.
      build-cache: false
      python-coverage-source: packaging
      python-coverage-script: packaging/nightly-tests.py
    secrets: inherit
