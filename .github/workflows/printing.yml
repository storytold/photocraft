name: Desktop printing

on:
  pull_request:
    paths:
      - 'crates/engine/src/print_cmds.rs'
      - 'crates/engine/src/print_cmds/**'
      - 'crates/ui-egui/src/file_ui.rs'
      - 'crates/ui-egui/tests/custom_print_paper.rs'
      - 'apps/photocraft/src/system_print.rs'
      - 'apps/photocraft/src/system_print_windows.ps1'
      - 'apps/photocraft/src/main.rs'
      - 'apps/photocraft/Cargo.toml'
      - 'crates/engine/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/printing.yml'
  push:
    branches: [main]
    paths:
      - 'crates/engine/src/print_cmds.rs'
      - 'crates/engine/src/print_cmds/**'
      - 'crates/ui-egui/src/file_ui.rs'
      - 'crates/ui-egui/tests/custom_print_paper.rs'
      - 'apps/photocraft/src/system_print.rs'
      - 'apps/photocraft/src/system_print_windows.ps1'
      - 'apps/photocraft/src/main.rs'
      - 'apps/photocraft/Cargo.toml'
      - 'crates/engine/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/printing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: printing-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  print:
    name: print (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PHOTOCRAFT_NO_PRINT: '1'
      LPDEST: photocraft-no-such-printer
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Print engine and platform contracts
        run: cargo test -p photocraft-engine --locked --lib print_cmds::tests
      - name: Print dialog controls
        run: cargo test -p photocraft-ui-egui --locked --lib file_ui::tests::print
      - name: Print controls and PDF output
        run: cargo test -p photocraft-ui-egui --locked --test custom_print_paper
      - name: Print crates and desktop adapters clippy
        run: cargo clippy -p photocraft-engine -p photocraft-ui-egui -p photocraft --locked --all-targets -- -D warnings
