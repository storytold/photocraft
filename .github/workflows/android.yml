name: Android Build

on:
  push:
    branches: [main, "feature/**", "android**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            name: arm64-v8a
          - target: x86_64-linux-android
            name: x86_64
          - target: armv7-linux-androideabi
            name: armeabi-v7a
          - target: i686-linux-android
            name: x86
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}

      - name: Cache cargo-apk binary
        uses: actions/cache@v4
        id: cache-cargo-apk
        with:
          path: ~/.cargo/bin/cargo-apk
          key: cargo-apk-binary-v0.10.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install cargo-apk
        if: steps.cache-cargo-apk.outputs.cache-hit != 'true'
        run: cargo install cargo-apk --locked

      - name: Install Android Platform
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "platforms;android-30" "build-tools;34.0.0"

      - name: Build APK (Release)
        run: |
          cargo apk build -p photocraft-android --target ${{ matrix.target }} --release

      - name: Locate and Stage APK
        run: |
          mkdir -p dist/apk
          APK_FILE=$(find target -name "*_android.apk" ! -name "*-unaligned.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find target -name "*.apk" ! -name "*-unaligned.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          cp -v "$APK_FILE" dist/apk/photocraft-android-${{ matrix.name }}.apk
          ls -lh dist/apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-android-${{ matrix.name }}-apk
          path: dist/apk/*.apk
