name: PhotoCraft unsigned nightly

# Enabled for supervised manual runs by the reviewed manual actor only; no schedule yet.
# A later explicit opt-in may add a cadence (and turn on nightly-dispatch.yml with it).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned:
    # Actual context guards only; no inherited/platform secrets.
    if: >-
      github.repository == 'storytold/photocraft' &&
      github.ref == 'refs/heads/main' && github.ref_type == 'branch' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    # Maximum for the reusable workflow. Its compiler narrows to contents/actions read;
    # no OIDC, attestation write, release environment or platform secrets in compilation.
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: storytold/craft-common-actions/.github/workflows/nightly-unsigned.yml@a4f6fd51e854773de8b24b4f92e1ad7e770c08d7
    with:
      tooling-revision: a4f6fd51e854773de8b24b4f92e1ad7e770c08d7
      app-name: photocraft
      manual-actors: '["skylartaylor"]'
      craft-fonts-ref: cc9269cd8d8258785dac603fba3122e5d2556795
      # One producer run builds every listed platform for one all-or-nothing release. The pin is the
      # craft-common-actions main commit that merged the Linux/macOS signer (#342).
      platforms: '["windows-x86_64","linux-x86_64","macos-aarch64"]'
