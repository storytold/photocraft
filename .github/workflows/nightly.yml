name: PhotoCraft unsigned nightly

# Dormant source registration at a reviewed public shared preview; no activation.
# No schedule/cadence has been authorized. A later explicit opt-in may add one.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned:
    # Literal off through source/hosted no-key qualification; no inherited/platform secrets.
    if: ${{ false }}
    # Maximum for the reusable workflow. Its compiler must override to contents-read only;
    # only the separate unsigned attester may receive OIDC/attestation-write.
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: storytold/craft-common-actions/.github/workflows/nightly-unsigned.yml@646d4c0619df19a6e76cb4d669f878e4a1e005d7
    with:
      tooling-revision: 646d4c0619df19a6e76cb4d669f878e4a1e005d7
      app-name: photocraft
      manual-actors: '[]'
      craft-fonts-ref: cc9269cd8d8258785dac603fba3122e5d2556795
