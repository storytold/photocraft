name: PhotoCraft unsigned nightly

# Dormant source registration at a reviewed public shared preview; no activation.
# No schedule/cadence has been authorized. A later explicit opt-in may add one.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned:
    # Literal off through source/hosted no-key qualification; no inherited/platform secrets.
    if: >-
      false && github.repository == 'storytold/photocraft' &&
      github.ref == 'refs/heads/main' && github.ref_type == 'branch' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    # Maximum for the reusable workflow. Its compiler narrows to contents/actions read;
    # no OIDC, attestation write, release environment or platform secrets in compilation.
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    uses: storytold/craft-common-actions/.github/workflows/nightly-unsigned.yml@REPIN_TO_MERGED_SHARED_SIGNER_SHA
    with:
      tooling-revision: REPIN_TO_MERGED_SHARED_SIGNER_SHA
      app-name: photocraft
      manual-actors: '[]'
      craft-fonts-ref: cc9269cd8d8258785dac603fba3122e5d2556795
      # One producer run builds every listed platform for one all-or-nothing release. The pin is a
      # local placeholder for the unmerged shared Linux/macOS signer; replace it in both callers
      # with that reviewed merged commit before this is published or activated.
      platforms: '["windows-x86_64","linux-x86_64","macos-aarch64"]'
