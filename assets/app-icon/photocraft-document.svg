<!-- PhotoCraft PSD document icon (master vector).
     Composition adapted from design 01, "red outline page", one of the icon redesigns
     JustCallMeAD posted in https://github.com/storytold/pdfcraft/issues/308: the page, its
     folded corner and the ArtCraft mark are theirs and are kept as exported. Finish for
     PhotoCraft: the outline and the mark are the app's blue (#2F7BF5), the field is the
     suite's deep ink (#001424), the fold is a filled rounded flap as in the shipped
     pdfcraft-document.svg instead of a hollow diagonal, and the lettering is Archivo ExtraBold converted to curves — the display face of
     getartcraft.com, so the label speaks in the brand's own voice on every desktop —
     "PSD" in Paper white, never live text.
     Geometry drawn in CorelDRAW 2026 and kept as exported. The ArtCraft mark is a brand
     mark of the ArtCraft project, used as a mark and not licensed for reuse; a fork that
     distributes a modified version must remove or replace it (LICENSE-document.txt).
     No fonts or external images. Every PNG and the .ico are rendered from this file. -->
