<!-- PhotoCraft .pcraft document icon (master vector).
     The native save format's file icon: the same page, fold and ArtCraft mark as
     photocraft-document.svg (the .psd icon), in the same palette, with the label reading
     "PCRAFT" because that is the extension PhotoCraft itself writes. Design 01, "red outline
     page", is JustCallMeAD's (https://github.com/storytold/pdfcraft/issues/308); this is the
     same treatment applied to the suite's own format.
     Outline and mark are the app's blue (#2F7BF5), the field is the deep ink (#001424), the
     lettering is white outlined type (Geist ExtraBold, converted to curves), never live text.
     The label runs to 60 % of the page width at a cap height of 77 % of the .psd icon's, so
     six letters sit in the same band without touching the frame.
     Geometry drawn in CorelDRAW 2026 and kept as exported. The ArtCraft mark is a brand mark
     of the ArtCraft project, used as a mark and not licensed for reuse; a fork that
     distributes a modified version must remove or replace it (LICENSE-document.txt).
     No fonts or external images. Every PNG and the .ico are rendered from this file. -->
