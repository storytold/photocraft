hayro = { git = "https://github.com/storytold/craft-libs", rev = "e2dc681a3" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "e2dc681a3" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "e2dc681a3" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "e2dc681a3" }
