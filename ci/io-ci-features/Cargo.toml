[package]
name = "photocraft-io-ci-features"
description = "CI-only feature pins so photocraft-io tests can reuse the gate cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Pins third-party features to the Linux gate's set. photocraft-io depends on this
# crate only as a dev-dependency, so `cargo build` (default members) is unchanged
# and `cargo nextest run -p photocraft-io` unifies the same features the gate compiled.
# This crate is not a default workspace member. Never depend on craft, craft-*, or photocraft-io.
[dependencies]
bitflags = { version = "2.13.2", default-features = false, features = ["serde", "serde_core", "std"] }
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "clock", "iana-time-zone", "now", "serde", "std", "winapi"] }
digest = { version = "0.10.7", default-features = false, features = ["alloc", "block-buffer", "core-api", "default", "mac", "std", "subtle"] }
ecolor = { version = "0.37.0", default-features = false, features = ["bytemuck", "serde"] }
either = { version = "1.19.0", default-features = false, features = ["std", "use_std"] }
emath = { version = "0.37.0", default-features = false, features = ["bytemuck", "serde"] }
font-types = { version = "0.12.7", default-features = false, features = ["bytemuck", "serde", "std"] }
gpu-allocator = { version = "0.28.0", default-features = false, features = ["d3d12", "hashbrown", "vulkan"] }
icu_collections = { version = "2.3.0", default-features = false, features = ["alloc", "serde"] }
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data", "default", "serde", "utf16_iter", "utf8_iter"] }
icu_properties = { version = "2.3.0", default-features = false, features = ["compiled_data", "default", "serde"] }
icu_provider_blob = { version = "2.3.0", default-features = false, features = ["alloc"] }
indexmap = { version = "2.14.2", default-features = false, features = ["default", "serde", "std"] }
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["auxvec", "elf", "errno", "general", "if_ether", "ioctl", "net", "netlink", "no_std", "prctl", "system", "xdp"] }
naga = { version = "30.0.1", default-features = false, features = ["default", "glsl-out", "hlsl-out", "spv-out", "wgsl-in"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rustix = { version = "1.1.5", default-features = false, features = ["alloc", "default", "event", "fs", "net", "pipe", "process", "shm", "std", "system", "termios", "time"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc", "default", "float_roundtrip", "std", "unbounded_depth"] }
skrifa = { version = "0.44.0", default-features = false, features = ["autohint_shaping", "std"] }
syn = { version = "3.0.10", default-features = false, features = ["clone-impls", "default", "derive", "extra-traits", "fold", "full", "parsing", "printing", "proc-macro", "visit", "visit-mut"] }
toml = { version = "1.2.1", default-features = false, features = ["default", "display", "parse", "serde", "std"] }
typenum = { version = "1.20.1", default-features = false, features = ["const-generics"] }
uuid = { version = "1.29.2", default-features = false, features = ["default", "rng", "serde", "std", "v4"] }
wayland-sys = { version = "0.31.11", default-features = false, features = ["client", "dlopen", "egl", "once_cell"] }
wgpu-types = { version = "30.0.1", default-features = false, features = ["fragile-send-sync-non-atomic-wasm", "std", "web"] }

# Host units of syn can diverge from the target graph; a build script makes Cargo
# select this crate's build-dependencies on the host.
[build-dependencies]
syn = { version = "3.0.10", default-features = false, features = ["clone-impls", "default", "derive", "extra-traits", "fold", "full", "parsing", "printing", "proc-macro", "visit", "visit-mut"] }
