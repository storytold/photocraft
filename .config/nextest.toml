# Refuse to run under a nextest older than the fixed release: GHSA-vc25-qg58-w57c is fixed in
# 0.9.150, and CI installs exactly that version (an older nextest exits 92 REQUIRED_VERSION_NOT_MET).
nextest-version = "0.9.150"

# cargo-nextest (https://nexte.st): runs every test in its own process, in parallel across test
# binaries. CI runs it with the `ci` profile below (#6117); locally it is optional and `cargo test`
# keeps working (#2204).
#
#   cargo nextest run --workspace        # all tests except doctests
#   cargo test --doc --workspace         # nextest does not run doctests
#
# GPU tests: each test is its own process here, so the in-process `gpu_lock()` mutexes no longer
# serialize them. Too many concurrent wgpu devices time out (`PollError: ... Wait timed out`), so
# this group caps them at 4. `cargo xtask ci tests --gpu` reads this group's filters directly: the
# Linux gate runs the group in a shard of its own on lavapipe (scripts/ci-gpu-lavapipe.py).
#
# The group is photocraft-gpu and every test in a module named `gpu_tests` or `<name>_gpu_tests`.
# A test that builds a wgpu device (a kittest `.wgpu()` harness, `create_render_state`, its own
# instance, or a harness `.render()`) lives in such a module and takes `gpu_lock()`. Every other
# test runs on the CPU canvas (the app draws on it unless `set_wgpu` hands it a device) at full
# parallelism.
[test-groups]
gpu = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(photocraft-gpu) | test(/(^|::|_)gpu_tests::/)'
test-group = 'gpu'

# CI (`--profile ci`, .github/workflows/ci.yml). Collect all failures in one integration run
# instead of exposing one regression per rebuild. A hanging test still terminates, and every
# failure is repeated at the end of the log. The default profile's GPU override still applies.
[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"
# The gate's shards run the tests from a nextest archive (`cargo xtask ci archive`) and start them
# with the xtask binary the archive carries, so a shard builds nothing. Only one of the two exists.
# With per-shard archives, each also carries the plan of which tests each shard runs
# (xtask/src/shards.rs).
archive.include = [
    { path = "debug/xtask", relative-to = "target", depth = 0, on-missing = "ignore" },
    { path = "debug/xtask.exe", relative-to = "target", depth = 0, on-missing = "ignore" },
    { path = "gate-shards.json", relative-to = "target", depth = 0, on-missing = "ignore" },
]

# panic_hunt drives every command with adversarial parameters and exists to find hangs, so a hang
# must cost seconds, not the profile's 10 minutes. It runs in 18 s on Linux and 26 s on Windows, so
# the first slow warning comes at 15 s and a run past 45 s is terminated.
[[profile.ci.overrides]]
filter = 'binary(panic_hunt)'
slow-timeout = { period = "15s", terminate-after = 3 }

# Content-Aware Move solves on rayon across every core. On the Windows runner the GPU tests draw
# on the CPU-backed adapter, so two of these beside a GPU test starve it until its device poll
# times out. Each runs alone there.
[[profile.ci.overrides]]
platform = 'cfg(target_os = "windows")'
filter = '(package(photocraft-engine-core) | package(photocraft-engine)) & test(/content_aware_move/)'
threads-required = "num-test-threads"

# Keep phase timings for the remaining expensive Windows GPU regressions visible. This does
# not relax their timeout, isolate failures differently or remove any test cases.
# Page eviction and budget borrowing redraw multi-effect documents. On the Windows
# CPU-backed adapter it uses all GPU slots, avoiding oversubscription without skipping work.
[[profile.ci.overrides]]
platform = 'cfg(target_os = "windows")'
filter = 'package(photocraft-gpu) & test(/pages_are_evicted_under_the_budget|layer_pages_that_just_miss_borrow_the_effect_map_share/)'
threads-required = 4
success-output = "immediate"

[[profile.ci.overrides]]
platform = 'cfg(target_os = "windows")'
filter = 'package(photocraft-gpu) & test(/documents_larger_than_the_texture_limit|layer_effects_update_incrementally|pages_are_evicted_under_the_budget|the_focused_view_stays_resident_after_a_full_refresh/)'
success-output = "immediate"
# These multi-page effect regressions saturate the Windows software GPU. Reserve two
# scheduling slots so four independent devices do not compete for the same CPU renderer.
# All cases and the 60-second warning remain unchanged.
threads-required = 2

# Slowest tests start first. nextest starts higher-priority tests first, so a long test no longer
# begins at the end of the run and extends the job. Every test that took over 60 s on the Windows
# runner in the cold run of #15474 (unit and integration legs); the same tests are the slowest on
# Linux. The list names the test, so a test that gets faster stays harmless and a new slow one is
# added here. Priority only orders the start; it changes no timeout, group or result.
[[profile.ci.overrides]]
# over 200 s
filter = '''
  (package(photocraft-ui-egui) & test(=input::shortcut_dispatch::tests::every_displayed_shortcut_dispatches_from_where_focus_usually_is)) |
  (package(photocraft-ui-egui) & test(=tone_targets::review_mask_action_context_matches_the_addressed_layer)) |
  (package(photocraft-ui-egui) & test(=tone_targets::grayscale_picker_controls_sample_the_plane_and_change_the_visible_curve)) |
  (package(photocraft-ui-egui) & test(=dialogs::adjust_editors::ui_tests::every_adjustment_layer_edits_through_properties)) |
  (package(photocraft-ui-egui) & test(=tone_targets::filter_mask_tone_dialogs_preserve_the_target_and_sample_its_own_levels))
'''
priority = 100

[[profile.ci.overrides]]
# 60 to 200 s
filter = '''
  (package(photocraft-gpu) & test(=camera_raw::clarity_texture_and_dehaze_with_shadows_highlights_and_per_pixel_stages)) |
  (package(photocraft-engine-core) & test(=cmd::retouch_cmds::content_aware_move::tests::a_coarse_preview_keeps_a_faint_sparse_selection)) |
  (package(photocraft-engine) & test(=crop_content_aware_layers::unmeasured_active_targets_and_delete_off_keep_the_legacy_target)) |
  (package(photocraft-engine-core) & test(=cmd::retouch_cmds::content_aware_move::color_tests::a_flat_patch_matches_the_new_surroundings_at_color_ten)) |
  (package(photocraft-ui-egui) & test(=tools::type_tool::canvas_tests::every_paragraph_box_handle_resizes_the_box_with_snapping_on)) |
  (package(photocraft-ui-egui) & test(=gpu_tests::checker_canvas::pixel_grid_is_solid_and_visible_gpu_2x)) |
  (package(photocraft-engine-core) & test(=cmd::retouch_cmds::tests::content_aware_move_coarse_preview_handles_transform_extend_and_limits)) |
  (package(photocraft-ui-egui) & test(=gpu_tests::checker_canvas::pixel_grid_is_solid_and_visible_cpu_2x)) |
  (package(photocraft-ui-egui) & test(=gpu_tests::drag_preview_canvas::marquee_previews_show_while_dragging_on_white_and_black_at_1x_and_2x)) |
  (package(photocraft-gpu) & test(=camera_raw::shadows_and_highlights_with_per_pixel_stages)) |
  (package(photocraft-engine-core) & test(=cmd::retouch_cmds::content_aware_move::color_tests::a_brightness_change_shifts_the_middle_only_past_color_five)) |
  (package(photocraft-engine-core) & test(=cmd::retouch_cmds::tests::content_aware_move_previews_large_selections_coarse_then_exact_at_all_depths)) |
  (package(photocraft-ui-egui) & test(=gpu_tests::live_stroke_canvas::live_tool_camera_navigation_is_visible_in_the_input_frame)) |
  (package(photocraft-ui-egui) & test(=gpu_tests::live_stroke_canvas::the_canvas_shows_the_committed_stroke_part_0)) |
  (package(photocraft-ui-egui) & test(=gpu_tests::full_res_preview::adjustment_layer_drag_previews_at_full_resolution_when_low_res_is_off)) |
  (package(photocraft-ui-egui) & test(=input::hold_keys::tests::cmd_gives_the_move_tool_only_where_the_tool_does_not_take_cmd)) |
  (package(photocraft-ui-egui) & test(=guide_cursor_tests::command_over_a_guide_takes_it_where_command_is_the_move_tool)) |
  (package(photocraft-gpu) & test(=parity::documents_larger_than_the_texture_limit)) |
  (package(photocraft-engine-core) & test(=cmd::retouch_cmds::content_aware_move::tests::a_preview_within_the_full_resolution_budget_is_the_plain_solve_bit_for_bit))
'''
priority = 50
