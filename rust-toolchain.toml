# The Rust release CI and contributors build with. One release means a new Rust release does not
# start a cold build in every cache key (they hold `rustc -vV`). The nightly CI run opens a pull
# request that changes only `channel` when a newer stable exists (scripts/ci-toolchain-bump.py).
# `rust-version` in Cargo.toml is the oldest release the sources support.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
