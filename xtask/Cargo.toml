[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["framework-checks"]
framework-checks = ["dep:craft", "dep:craft-i18n"]

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
# perf/budgets.toml and scorecard/*.toml (MIT OR Apache-2.0).
toml = "1"
# `i18n-report` looks the UI strings up in the craft-i18n catalogs as the app does.
craft-i18n = { workspace = true, optional = true }
# `egui-fork` checks Cargo.lock against `craft::egui_fork`.
craft = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

