[package]
name = "photocraft-algo"
description = "Depth-agnostic, tile-aware CPU image filters (blur, sharpen, noise, distort, stylize)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-develop = { workspace = true }
craft-develop-model = { workspace = true }
craft-metadata = { workspace = true }
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustfft = "6.4.1"
# `craft::imaging::fold_order`, `RawDevelopSettings` and `WideAngleSession`; the facade's `ui` stays off, so algo is egui-free.
craft = { workspace = true, features = ["imaging"] }

# Parallel tiles on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
photocraft-testkit = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "blur"
harness = false
