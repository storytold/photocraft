[package]
name = "photocraft-text"
description = "Font database, text shaping/layout (parley) and text-layer rasterization"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-doc = { workspace = true }
craft-psd = { workspace = true }
craft-plist = { workspace = true }
# No `system` feature: fontique's system backend links fontconfig on Linux. The installed fonts
# come from the craft font Catalog; the bundled fonts are always registered (native + web).
craft = { workspace = true, default-features = false, features = ["font-catalog", "font-manager"] }
parley = { version = "0.11", default-features = false, features = ["std"] }
skrifa = "0.47"
flate2 = { workspace = true }
# Subresource Integrity values for served fonts.
base64 = "0.23"

# ICU dictionary data for Japanese word boundaries and complex-script (Thai, Lao, Khmer, Burmese)
# line breaking. Native only: the CJK dictionary alone is 3.8 MB of wasm, and the web build must
# stay under Cloudflare's 25 MiB per-file cap (packaging/web/package.sh). The web build falls back
# to the generic Unicode rules for those scripts.
# Native only: the glyph rasteriser composites and converts its pixel buffers on all cores.
# The Catalog's system listing (CoreText, DirectWrite and fontconfig files) is native only too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parley = { version = "0.11", default-features = false, features = ["std", "complex-scripts"] }
craft = { workspace = true, default-features = false, features = ["font-catalog-system"] }
rayon = { workspace = true }

[build-dependencies]
# Deflates the bundled fonts (build.rs); `flate2` above inflates them.
flate2 = { workspace = true }
