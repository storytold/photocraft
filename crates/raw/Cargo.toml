[package]
name = "photocraft-raw"
description = "PhotoCraft camera-raw develop pipeline over craft-raw's format-neutral decoded sensor model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Synthetic raw-file generators (DNG / CR2 / TIFF-EP writers and a lossless-JPEG
# encoder) for tests and fuzz seeds.
testgen = ["dep:image", "dep:flate2"]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
craft-raw.workspace = true
# Synthetic fixture output used only by the retired format-parser tests.
image = { workspace = true, features = ["jpeg"], optional = true }
flate2 = { workspace = true, optional = true }

# Parallel bands on native; wasm builds stay single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
photocraft-raw = { path = ".", features = ["testgen"] }
# Writes sRGB PNG previews in the `rawinfo` example.
png = "0.18"
# JPEG XL encoder used by legacy test fixtures only.
zune-jpegxl = { version = "=0.5.2", default-features = false, features = ["std"] }
zune-core = "0.5"

[lints]
workspace = true
