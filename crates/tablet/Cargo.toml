[package]
name = "photocraft-tablet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pen tablet pressure, tilt, rotation and eraser end on macOS (AppKit), Linux X11 (XInput2) and Windows (Wintab)"

# The one isolated `unsafe` helper crate (craftrules never-crash, AGENTS.md): the AppKit event
# monitor needs Objective-C interop, and the Windows Wintab reader subclasses the window and
# calls a dynamically loaded `wintab32.dll`. Only `src/macos.rs` and `src/wintab.rs` allow
# `unsafe`; everything else is denied, and every other crate keeps `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Already in Cargo.lock (eframe/wgpu/fmv-macos-events and winit pull them in); pinned exactly:
# review the diff before bumping.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSEvent"] }

# Pure-Rust X11 client (no unsafe in the RustConnection path we use).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", default-features = false, features = ["xinput"] }

# Already in Cargo.lock (wgpu pulls it in); pinned exactly: review the diff before bumping.
# Only the features the Wintab reader needs (window subclassing and queries, dynamic loading).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Tests build real tablet NSEvents (from CGEvents) and read them through the monitor's path.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSGraphicsContext", "objc2-core-graphics", "NSApplication", "NSResponder"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

[[test]]
name = "monitor_macos"
harness = false
