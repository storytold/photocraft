[package]
name = "photocraft-tablet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native pen and GC-assisted mouse input"

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry", "NSProcessInfo", "NSEnumerator", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSView", "NSWindow", "NSResponder"] }
objc2-game-controller = { version = "=0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "GCDevice", "GCMouse", "GCMouseInput", "GCPhysicalInputProfile"] }
dispatch2 = "=0.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", default-features = false, features = ["xinput"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSGraphicsContext", "NSGraphics", "objc2-core-graphics", "NSApplication", "NSResponder"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

[[test]]
name = "monitor_macos"
harness = false
