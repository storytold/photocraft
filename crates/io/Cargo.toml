[package]
name = "photocraft-io"
description = "Import/export between photocraft documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# `pdf_budget_wasm`: the PDF image-budget check as a binary, run under node as wasm32 (see
# wasm/pdf_budget_wasm.rs); off, so ordinary builds and installs don't carry it.
wasm-budget-check = []
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to photocraft-codecs; see its `heif` feature).
heif = ["photocraft-codecs/heif", "photocraft-formats/heif"]
# Test support for synthetic memory injection, estimate charges and verification across crates.
testgen = []
# Editable PDF import (experimental): painted paths and embedded-font text become editable
# layers; unsupported constructs keep the raster page.
pdf-editable = []

[dependencies]
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
craft-cms = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-compose = { workspace = true }
photocraft-algo = { workspace = true }
craft-psd = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-formats = { workspace = true }
photocraft-raw = { workspace = true }
craft-affinity = { workspace = true }
photocraft-text = { workspace = true }
photocraft-paint = { workspace = true }
photocraft-vector = { workspace = true }
photocraft-format = { path = "../format" }
craft-pdf = { workspace = true }
craft-docpath = { workspace = true }
craft-ora = { workspace = true }
craft-kra = { workspace = true }
craft-xcf = { workspace = true }
craft-pdn = { workspace = true }
craft-svg = { workspace = true }
craft-tiff = { workspace = true }
craft-crs = { workspace = true }
craft-xml = { workspace = true }
thiserror = { workspace = true }
ttf-parser = "0.25.1"
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
# pdn.rs inflates Paint.NET's gzip pixel chunks.
flate2 = { workspace = true }
# The geometry type craft-pdf's interpreter hands a device (the version it uses).
kurbo = "0.13"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The SVG fallback font search keeps each font file's character map (already in the tree through usvg).
ttf-parser = { version = "0.25", default-features = false }

[dev-dependencies]
lopdf = { version = "0.38", default-features = false }
# PDF XMP serialization assertions parse output XML in tests.
roxmltree = "0.21"
miniz_oxide = "0.9"
crc32fast = "1.5"
craft-affinity = { workspace = true, features = ["synth"] }
flate2 = { workspace = true }
craft-psd = { workspace = true, features = ["testgen"] }
photocraft-raw = { workspace = true, features = ["testgen"] }
photocraft-testkit = { workspace = true }
proptest = { workspace = true }
# Lossless JPEG XL encoder for the JPEG XL DNG preview test (tests only), as in photocraft-raw.
zune-jpegxl = { version = "=0.5.2", default-features = false, features = ["std"] }
zune-core = { workspace = true }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }

[[bin]]
name = "pdf_budget_wasm"
path = "wasm/pdf_budget_wasm.rs"
required-features = ["wasm-budget-check"]
test = false
bench = false
doc = false
