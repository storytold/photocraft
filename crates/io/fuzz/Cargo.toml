[package]
name = "photocraft-io-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

# Separate cargo-fuzz workspace, following the other format crates.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
photocraft-io = { path = ".." }

[[bin]]
name = "xcf_import"
path = "fuzz_targets/xcf_import.rs"
test = false
doc = false
bench = false

# A separate fuzz workspace does not inherit the host workspace patches.
# craft-pdf requires the same reviewed Hayro API as the application.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/craft-libs", rev = "e2dc681a3" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "e2dc681a3" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "e2dc681a3" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "e2dc681a3" }
