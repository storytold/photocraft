[package]
name = "photocraft-io-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

# Separate cargo-fuzz workspace. Native smoke tests use the existing IO it binary.
[workspace]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
photocraft-io = { path = ".." }

[[bin]]
name = "xcf_import"
path = "../tests/it/xcf_fuzz_smoke.rs"
test = false
doc = false
bench = false

# A standalone fuzz workspace must repeat the host's actual reviewed overrides.
# Keep these source IDs aligned with the root Cargo.toml, not an older app branch.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "5c5e0d52c387c0a4ae2908a07e476d7584f60362" }
