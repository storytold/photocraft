[package]
name = "photocraft-ipp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

# Standalone: excluded from the photocraft workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
photocraft-ipp = { path = ".." }

[[bin]]
name = "reply"
path = "fuzz_targets/reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false
