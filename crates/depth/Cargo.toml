[package]
name = "photocraft-depth"
description = "PhotoCraft monocular depth estimation (Depth Anything V2 Small on candle, CPU)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Native only: the inference stack is not built for wasm, where `Model::load` reports "unsupported".
# candle 0.9.2 exactly: the newest release without a `tokenizers` dependency (see README.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }
candle-transformers = { version = "=0.9.2", default-features = false }

[lints]
workspace = true
