[package]
name = "photocraft-heif"
description = "Optional HEIF/HEIC still-image decoder for PhotoCraft (a thin, panic-guarded wrapper around heic-decoder)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Pure Rust, no unsafe, no C; HEVC output bit-exact against the HM reference decoder. Pinned
# exactly: a young crate that parses untrusted files, so moving the pin is a reviewed change
# (re-run the fuzz target and the heif corpus tests). Grid tiles decode in parallel with rayon on
# native; on wasm rayon's pool falls back to the calling thread.
heic-decoder = "=0.1.0"

[lints]
workspace = true
