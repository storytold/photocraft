[package]
name = "photocraft-script-js"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs .js/.jsx scripts against a PhotoCraft session (Boa engine), each in a script host process of its own."

[lints]
workspace = true

[dependencies]
# boa_engine and boa_gc are pinned exactly together: stopping a run relies on 0.22.0 treating
# every engine error as uncatchable (src/abort.rs, whose tests check it), and the bracket
# guard on the parser's recursion (src/scan.rs).
boa_engine = { version = "=0.22.0", default-features = false, features = ["annex-b"] }
boa_gc = "=0.22.0"
serde = { workspace = true }
serde_json = { workspace = true }
photocraft-engine = { workspace = true }
# The script host's heap limit, enforced on every allocation (src/isolate/heap.rs).
cap = "=0.1.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Resident size of the script host, polled by the app (src/isolate/limits.rs).
sysinfo = { version = "=0.40.1", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
# The script host's own memory limit (Linux) and stopping its process group, without unsafe code.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

[target.'cfg(windows)'.dependencies]
# A job object that ends the script host with the app, without unsafe code.
win32job = "2.1"
