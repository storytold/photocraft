[package]
name = "photocraft-script-js-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
photocraft-script-js = { path = ".." }
serde_json = "1"

# The app reads these frames from an untrusted script host.
[[bin]]
name = "from_host"
path = "fuzz_targets/from_host.rs"
test = false
doc = false
bench = false
