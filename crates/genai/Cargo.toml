[package]
name = "photocraft-genai"
description = "Local generative backends for PhotoCraft: the GenerativeBackend trait, the native worker and model metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# An in-process fake native worker for this crate's tests and for
# the engine's `generate.*` command tests. Never enabled in a shipped build.
fake-server = []
# The native worker also serves Qwen-Image-2.1 text to image (`gn-diffusion`: candle + the CUDA
# kernels of qwen-image-rs, plan Phase 2). Off by default: it needs nvcc, CUTLASS and a CUDA
# toolkit to build (docs/comfy/dev-environment-windows.md). With it, SAM 3.1 runs on candle on the
# GPU from its checkpoint (Rust rebuild R1); a build without it has no SAM 3.1 backend (the worker
# answers `select.*` requests ModelMissing).
native-diffusion = ["dep:gn-diffusion", "gn-perception/cuda"]

[dependencies]
photocraft-codecs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The native worker protocol uses loopback IPC. Wasm has no local worker client; seeds
# there use a counter instead of requiring a JS backend for getrandom.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }
# The native engine's worker channel (plan-native-engine §3.4) and its perception models (SAM 3.1
# on candle, plan Phase 1 / Rust rebuild R1), pinned by commit; the repository is private for now,
# so `.cargo/config.toml` fetches it with the system git. The NVIDIA runtime libraries come from a
# folder the user names (`integrations.runtimePath`), put on the worker's `PATH`.
gn-engine = { git = "https://github.com/CodyChuGit/genai-native.git", rev = "795be161dddcc466c5bbf0303161488e9efc733d" }
gn-perception = { git = "https://github.com/CodyChuGit/genai-native.git", rev = "795be161dddcc466c5bbf0303161488e9efc733d", default-features = false, features = ["engine"] }
gn-diffusion = { git = "https://github.com/CodyChuGit/genai-native.git", rev = "795be161dddcc466c5bbf0303161488e9efc733d", features = ["cuda"], optional = true }
# The worker's log: the engines speak `tracing`; with `RUST_LOG` set the worker writes their
# phase timings (load, encode, sampling, decode) to its stderr.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
