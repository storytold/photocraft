[package]
name = "photocraft-cms"
description = "Pure-Rust ICC v2/v4 colour management: profile parsing and writing, transforms, rendering intents, black point compensation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
moxcms = "0.8"

# The browser threads build (wasm with `atomics`, packaging/web-threads) takes the rayon paths too.
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
rayon = { workspace = true }
