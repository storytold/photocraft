[package]
name = "photocraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# craft's component derives gate their story-suite registrations on a crate's own `suite` feature
# (storytold/craft-libs#2363); without one they need craft's test kit in every build. PhotoCraft runs
# no craft story suite, so this stays off.
suite = ["craft/suite"]

[dependencies]
chrono = { workspace = true }
craft-print = { workspace = true }
craft-xml = { workspace = true }
craft = { workspace = true, features = ["ui", "layers", "color-ui", "draw", "imaging", "window", "keymap", "automation", "theme-store", "print", "menu", "timeline", "text", "text-font-picker", "font-manager", "quit", "cms", "tracked-serde"] }
# Interface translations over the embedded craft-i18n catalogs (`build.rs`, `src/i18n.rs`).
craft-i18n = { workspace = true }
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-compose = { workspace = true }
photocraft-gpu = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-plugins = { workspace = true }
photocraft-algo = { workspace = true }
photocraft-text = { workspace = true }
photocraft-vector = { workspace = true }
# Only MAX_BRUSH_SIZE: `ui.set brushSize` validates against the Brush Settings range up front.
photocraft-paint = { workspace = true }
# Reading files to open them (bounded reads, a clear error for files larger than memory).
photocraft-format = { workspace = true }
# Decoding the brand mark's PNG (`brand.rs`); already linked through photocraft-io.
photocraft-codecs = { workspace = true }
photocraft-formats = { workspace = true }
# Reading embedded thumbnail resources (1036/1033) for recent files in Home screen.
craft-psd = { workspace = true }
# `serde`: the dialog state the control channel and the saved memories read holds `egui::Id`s. Asked for
# here so this crate builds on its own (`cargo test -p photocraft-ui-egui`) and in the browser build.
egui = { workspace = true, features = ["serde"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
eframe = { workspace = true, features = ["wgpu", "accesskit", "clipboard"] }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The tables of craft-host's `SectionStore` (`app/framework.rs`); already linked through craft-host.
toml = { version = "1.1", default-features = false, features = ["std", "serde"] }
log = { workspace = true }
base64 = "0.23"
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `FilePanels::pump_with`: rfd's folder picker and file paths exist on native only. Agents in the
# open window (`craft::automation::agents`: the link, the launcher's switch, the Agents page) too.
craft = { workspace = true, features = ["dialogs", "update", "automation-agents"] }
rayon = { workspace = true }
# Safe native UI-language APIs (Windows/macOS); no subprocess or web dependency.
sys-locale = "=0.3.2"

# Installed RAM for the GPU memory budget (`gpu_canvas::physical_memory`) and the user's decimal
# symbol (`i18n::decimal_separator`, a registry read): the safe binding the desktop app already
# uses, pinned to the same version.
[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel", "dxgi", "advapi"] }

[dev-dependencies]
photocraft-io = { workspace = true, features = ["testgen"] }
# egui's own default fonts in tests, so contexts made with `Context::default()` (no
# install_fonts) can lay out text.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
# Synthetic raw files for the open-time Camera Raw dialog tests.
photocraft-raw = { workspace = true, features = ["testgen"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
# Benchmark helpers for the `--json` benches `cargo xtask perf` runs (in-process RSS, percentiles).
photocraft-testkit = { workspace = true }
# examples/perf_scenarios.rs (a 500-brush .abr for the #210 import row) and large_file_bench.rs
# (the generated 2 GB PSD and 4.4 GB PSB of P20, `fixtures`).
craft-psd = { workspace = true, features = ["testgen"] }
# Isolated, self-cleaning folders for filesystem tests (the LUT folder, #6558).
tempfile = "3"
# The framework's test helpers, e.g. the thumbnail and fx badge rects of a Layers panel row
# (`craft::layers::testing`), and the in-memory settings files (`craft::settings::testing`).
craft = { workspace = true, features = ["screen-testing", "settings-testing"] }
# The prefs tests write a saved settings file (`toml::to_string`).
toml = { version = "1.1", default-features = false, features = ["std", "serde", "display"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[[example]]
name = "flat_open_bench"
test = true
