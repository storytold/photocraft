[package]
name = "photocraft-compose"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Test seams for dependants' tests (`filter_mask::tiles_visited`); never on in a release build.
testgen = []

[dependencies]
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-vector = { workspace = true }
craft-cms = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
photocraft-paint = { workspace = true }

[[bench]]
name = "compose"
harness = false
