services:
  web:
    image: ${PHOTOCRAFT_WEB_IMAGE:-photocraft-web:0.8.2-ai-20261013}
    container_name: photocraft-web
    restart: unless-stopped
    env_file:
      - ../../secrets/web.env
    ports:
      - "${PHOTOCRAFT_WEB_HOST_IP:-127.0.0.1}:${PHOTOCRAFT_WEB_PORT:-18888}:8080"
    cpus: 2
    mem_limit: 4g
    read_only: true
    volumes:
      - ../../secrets/web-config:/data:rw
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
