name: PhotoCraft
options:
  createIntermediateGroups: false
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.17.0
    SWIFT_VERSION: 6.0
targets:
  PhotoCraft:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        EXECUTABLE_NAME: photocraft-ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: PhotoCraft
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: 2
    preBuildScripts:
      - name: Build Rust executable
        script: /bin/sh "$SRCROOT/build-rust.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)"
schemes:
  PhotoCraft:
    build:
      targets:
        PhotoCraft: all
    run:
      config: Debug
    archive:
      config: Release
