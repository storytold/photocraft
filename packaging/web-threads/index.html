<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PhotoCraft</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #photocraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    #photocraft_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; white-space: pre-line; }
    #photocraft_loading a { color: #e0e0e0; pointer-events: auto; }
    #photocraft_loading.error p { color: #f0a0a0; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #photocraft_stalled { color: #8c8c8c; visibility: hidden; animation: photocraft-stalled 0s 30s forwards; }
    @keyframes photocraft-stalled { to { visibility: visible; } }
  </style>
</head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <div id="photocraft_loading">
    <p id="photocraft_status">Loading PhotoCraft&hellip;</p>
    <p id="photocraft_stalled">This is taking longer than usual. If PhotoCraft doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
  <script type="module">
    // Threads build (packaging/web-threads): the module shares one memory with a pool of Web
    // Workers, so the page must be cross-origin isolated (COOP + COEP, see _headers). The pool
    // is started before the app so rayon never falls back to its one-thread pool.
    const version = '__PHOTOCRAFT_VERSION__';
    const loading = document.getElementById('photocraft_loading');
    const status = document.getElementById('photocraft_status');
    const fail = (msg) => {
      loading.classList.add('error');
      status.textContent = msg;
      document.getElementById('photocraft_stalled').remove();
    };
    try {
      if (!self.crossOriginIsolated) {
        throw new Error('This page is not cross-origin isolated, so WebAssembly threads (SharedArrayBuffer) are ' +
          'unavailable. The server must send Cross-Origin-Opener-Policy: same-origin and ' +
          'Cross-Origin-Embedder-Policy: require-corp.');
      }
      const pc = await import(`./photocraft.js?v=${version}`);
      // The module ships gzipped (build.sh); inflate it on its way into streaming compilation.
      const gz = await fetch(`./photocraft_bg.wasm.gz?v=${version}`);
      if (!gz.ok) throw new Error(`photocraft_bg.wasm.gz: HTTP ${gz.status}`);
      const wasm = new Response(gz.body.pipeThrough(new DecompressionStream('gzip')), { headers: { 'Content-Type': 'application/wasm' } });
      await pc.default({ module_or_path: wasm });
      // One worker per core but one (the UI thread spins while it waits for them), at most 16.
      // ?threads=N overrides it (1 runs every parallel step on one worker; useful to compare).
      const asked = Number(new URLSearchParams(location.search).get('threads'));
      const cores = navigator.hardwareConcurrency || 4;
      const threads = asked > 0 ? Math.min(Math.floor(asked), 64) : Math.max(1, Math.min(cores - 1, 16));
      status.textContent = `Starting ${threads} worker thread${threads === 1 ? '' : 's'}…`;
      await pc.initThreadPool(threads);
      self.photocraft = pc; // the module, for diagnostics: photocraft.parallelSelfTest(4000, 3000)
      self.photocraftThreads = threads;
      console.info(`photocraft-web: rayon pool of ${threads} Web Workers`);
      status.textContent = 'Loading PhotoCraft…';
      pc.start();
    } catch (e) {
      console.error(e);
      fail(`PhotoCraft could not start:\n${e && e.message ? e.message : e}`);
    }
  </script>
</body>
</html>
