<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 492" width="880" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>ShotoPhopEX native engine vs ComfyUI on an RTX 5090, warm seconds, lower is faster</title>
