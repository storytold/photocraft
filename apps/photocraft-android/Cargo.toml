[package]
name = "photocraft-android"
description = "Native Android Activity shell for PhotoCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The Android NativeActivity/JNI exported symbols require #[unsafe(no_mangle)].
# Their implementations stay in safe Rust; no raw JNI pointers are accessed.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[lib]
name = "photocraft_android"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.13"
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = { workspace = true }
log = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-ui-egui = { workspace = true }
photocraft-io = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-format = { workspace = true }
