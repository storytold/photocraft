[package]
name = "photocraft-android"
description = "PhotoCraft on Android (eframe wgpu runner via android-activity)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[lib]
crate-type = ["cdylib", "rlib"]
name = "photocraft_android"
path = "src/lib.rs"

[features]
default = []
# Open HEIC/HEIF photos (optional photocraft-heif crate)
heif = ["photocraft-codecs/heif"]

[dependencies]
photocraft-doc = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-io = { workspace = true }
photocraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }

[package.metadata.android]
package = "ai.storyteller.photocraft"
apk_name = "photocraft_android"
resources = "res"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = true

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
version = 1
required = false

[package.metadata.android.application]
label = "PhotoCraft"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.NoTitleBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|uiMode|density"
resizeable_activity = true

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34


