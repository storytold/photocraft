[package]
name = "photocraft-android"
description = "PhotoCraft on Android: eframe + wgpu shell on GameActivity, reusing the desktop engine and egui UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace forbids `unsafe`; the Android entry point needs `#[unsafe(no_mangle)]`, so this
# crate follows the `crates/platform` / `patches/filmcraft-android` pattern: `deny`, with
# `#[allow(unsafe_code)]` on the entry point and the JNI calls (each block carries a SAFETY note).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[lib]
name = "main"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
photocraft-engine = { workspace = true }
photocraft-ui-egui = { workspace = true }
photocraft-io = { workspace = true }
photocraft-format = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-compose = { workspace = true }
photocraft-doc = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
jni = "0.22"
ndk-context = "0.1"
eframe = { workspace = true, default-features = false, features = [
    "default_fonts",
    "wgpu",
    "android-game-activity",
] }
winit = { version = "0.30", default-features = false }
android_logger = "0.15"
