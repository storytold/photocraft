[package]
name = "photocraft-mobile"
description = "PhotoCraft on iPadOS/iOS and Android: the shared app behind a thin native shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# staticlib: linked into the Swift shell (iOS). cdylib: loaded by the Compose shell (Android).
crate-type = ["staticlib", "cdylib", "rlib"]

# Not the workspace table: the workspace forbids unsafe_code, and the exported start symbols
# (`#[unsafe(no_mangle)]`, from `craft_mobile::export!`) are the one thing a native shell needs.
# Everything else stays denied.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"

[dependencies]
# The shared native-shell host (local checkout beside the Craft repos; upstream: craft-libs).
craft-mobile = { path = "../../../../craft-mobile" }
serde_json = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "accesskit"] }
log = { workspace = true }

