[package]
name = "photocraft-web-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
photocraft-engine = { workspace = true }
photocraft-ai = { workspace = true }
photocraft-format = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
constant_time_eq = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
